name: mesa_clasica
description: "Mesa Clásica: juegos de mesa clásicos para jugar en la misma red."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
