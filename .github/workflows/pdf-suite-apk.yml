name: ArtCraft PDF · APK

on:
  push:
    paths: ['pdf-suite/**', '.github/workflows/pdf-suite-apk.yml']
  pull_request:
    paths: ['pdf-suite/**', '.github/workflows/pdf-suite-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pdf-suite/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK de prueba
        run: cd android && ./gradlew assembleDebug --no-daemon
      # APK firmada: requiere los secretos ARTCRAFT_KEYSTORE_BASE64, ARTCRAFT_KEYSTORE_PASSWORD y ARTCRAFT_KEY_PASSWORD
      - name: Compilar APK firmada
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ARTCRAFT_KEYSTORE_BASE64 }}
          ARTCRAFT_KEYSTORE_PASSWORD: ${{ secrets.ARTCRAFT_KEYSTORE_PASSWORD }}
          ARTCRAFT_KEY_PASSWORD: ${{ secrets.ARTCRAFT_KEY_PASSWORD }}
          ARTCRAFT_KEY_ALIAS: artcraft
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ARTCRAFT_KEYSTORE="$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-PDF-apk
          path: |
            pdf-suite/android/app/build/outputs/apk/debug/app-debug.apk
            pdf-suite/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
